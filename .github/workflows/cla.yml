# The contributor agreement, asked for once and recorded.
#
# `CONTRIBUTING.md` says why there is one: APERtrail and NODAtrail are PolyForm
# Noncommercial and a commercial licence for them stays possible only while
# Technosoftware holds the rights to every line. That is a promise about every
# contribution, so it cannot rest on somebody remembering to ask.
#
# The bot comments on a pull request from anybody who has not signed, and the
# contributor signs by replying with one sentence. The signature is committed
# to `.github/cla/signatures.json` on main, so the record lives in the
# repository rather than in a service.
#
# `pull_request_target` rather than `pull_request` is what the action requires
# and is the reason there is no checkout step here: this workflow runs with
# write access in the context of the base branch and must never run code from
# the pull request.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check the agreement
        # `recheck` is the escape hatch when the bot and the signature file
        # disagree; anything else typed in a comment must not start a run.
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/technosoftware-gmbh/TRAILsuite/blob/main/CLA.md'
          path-to-signatures: '.github/cla/signatures.json'
          branch: 'main'
          # The owner, and the bots. Dependabot cannot sign anything, and a
          # release built by a workflow is not a contribution by a person.
          allowlist: technosoftware,*[bot]
