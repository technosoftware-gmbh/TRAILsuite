# Publishing the core, by the thing that will be publishing it.
#
# `@technosoftware/trail-core` is the one package here that ships to a registry
# rather than into a vault, and it is therefore the one release that cannot be
# redone: an npm version is immutable and a name, once taken, stays taken. That
# is why this is a workflow and not a step somebody runs at the end of a long
# day.
#
# **No token.** Publishing authenticates over OIDC as this repository and this
# workflow file, named as a trusted publisher on the package's npm settings
# page. There is no npm credential in this repository to leak, rotate or
# forget, and npm attaches a provenance attestation on its own because the
# repository and the package are both public. `--provenance` is deliberately
# not passed: it is implied here, and passing it would suggest it is what makes
# it happen.
#
# **It stages rather than publishes.** A tag uploads the tarball into npm's
# staging queue and stops; somebody then approves it with a 2FA challenge from
# their own machine, and only then is it installable. So the worst a mistyped
# tag can now do is put a version in a queue, which can be rejected, rather than
# on the registry, which cannot be undone. That is the whole reason for the
# change, and it is worth stating here because the file no longer does what its
# name suggests on its own.
#
# **The first publish cannot come from here.** A trusted publisher is
# configured on a package's settings page, and that page does not exist until
# the package does. So 1.0.0 goes up by hand from a clean checkout, the trusted
# publisher is configured against this file, and every version after it comes
# from a tag. `docs/releasing.md` step 6 says the same thing in the same order.
name: publish core

on:
  push:
    tags:
      - 'core-v*'

permissions:
  contents: read
  # The OIDC token itself. Publishing fails with ENEEDAUTH without it, and the
  # error does not mention this line.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # Node 22 ships npm 10, and OIDC publishing needs 11.5.1 or later.
      # Pinned to the major rather than `latest`, so a future npm cannot change
      # what a tag publishes without somebody editing this line first.
      - run: npm install -g npm@^11

      # What the runner actually handed this job, said out loud.
      #
      # Two releases have now died on a 404 that explains nothing, and the
      # whole log was silent about both of the things that decide whether
      # trusted publishing can even be attempted. So they are printed, once,
      # before anything expensive runs.
      #
      # **npm publishes unauthenticated rather than refusing to.** Without an
      # id-token request URL in the environment there is no OIDC exchange, npm
      # sends no credential at all, and the registry answers `404 Not Found -
      # PUT` rather than 403, because it will not confirm that a package exists
      # to somebody who cannot publish it. That 404 is the least informative
      # true thing it could say, and it is why this step exists.
      #
      # The runner sets those variables only when `id-token: write` was
      # actually granted, which is not the same question as whether the
      # workflow asked for it.
      - name: Say what this job was given
        run: |
          echo "npm $(npm --version), needs 11.5.1 or later for OIDC"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC: the runner issued an id-token request URL"
          else
            echo "OIDC: no id-token request URL was issued to this job."
            echo "Publishing from here would go up with no credential and be"
            echo "refused as a 404. Stopping instead, because that 404 reads"
            echo "as though the package does not exist."
            exit 1
          fi

      - run: npm ci

      # The whole suite rather than this package alone. The core is what the
      # three plugins are built against, so a core that ships untested ships
      # into all three of them.
      - run: npm run check

      # A tag disagreeing with the manifest would publish a version nobody
      # asked for, and npm does not give it back. Same guard as `release.yml`
      # applies to a plugin's `manifest.json`, for the same reason.
      - name: Refuse a tag the manifest does not agree with
        run: |
          tagged="${GITHUB_REF_NAME#core-v}"
          manifest=$(node -p "require('./packages/core/package.json').version")
          if [ "$manifest" != "$tagged" ]; then
            echo "tag says $tagged, package.json says $manifest"
            exit 1
          fi

      # Whether this version is already spoken for.
      #
      # Two questions now rather than one, because a staged version is neither
      # published nor nothing: it holds the version, `npm view` cannot see it,
      # and staging the same version twice is refused. A guard that asked only
      # the first question would send a re-run straight into a duplicate, which
      # is the case the guard exists for.
      #
      # The original reason still stands. The first release of a package goes
      # up by hand, before a trusted publisher can be configured against a
      # settings page that does not exist yet, and its tag would otherwise
      # arrive here and fail on a version that is already exactly right.
      #
      # This does not soften the guard above. A tag disagreeing with the
      # manifest is still refused, and that is the case where a version nobody
      # meant could go out.
      - name: Is this version already published or staged
        id: published
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          spec="@technosoftware/trail-core@$version"

          if npm view "$spec" version > /dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$spec is on the registry already; nothing to do."
            exit 0
          fi

          # The staging queue, which `npm view` does not answer for. This half
          # is best-effort and says so: reading the queue is authenticated, and
          # this step runs before the OIDC exchange that the stage itself
          # performs, so a silent no here means "could not tell" as often as it
          # means "not staged". Worth asking for the times it does answer;
          # never worth trusting a no.
          if npm stage view "$spec" > /dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$spec is staged already, waiting for somebody to approve it."
            exit 0
          fi

          echo "already=false" >> "$GITHUB_OUTPUT"

      # **Staged, not published.** The tarball goes up and stops there: it is
      # not installable, and it becomes a release only when a maintainer
      # approves it from their own machine with a 2FA challenge. A tag can
      # therefore no longer put a version in front of the world on its own,
      # which is the one property this file could not offer while it ended in
      # `npm publish`.
      #
      # The registry enforces the difference rather than this line doing it:
      # with "Allow `npm publish`" unticked on the trusted publisher, a direct
      # publish from here is refused. Changing this back means changing both.
      #
      # `prepare` builds `dist/`, which `exports` points at, so what goes up is
      # what a clean checkout produces rather than whatever was on disk.
      #
      # Approving it is two commands on a machine that can answer 2FA, and
      # `docs/releasing.md` step 6 spells them out.
      - run: npm stage publish
        if: steps.published.outputs.already == 'false'
        working-directory: packages/core
